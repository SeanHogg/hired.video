name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run type checking
        run: npm run typecheck

      - name: Build SPA
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            package.json
            package-lock.json
          retention-days: 7

  deploy-production:
    name: Deploy to SmarterASP.NET
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Configure for production
        run: |
          # Generate build timestamp
          BUILD_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")
          
          # Create production config with actual timestamp
          cat > dist/config.js << EOF
          // Runtime configuration for production deployment
          window.APP_CONFIG = {
            // API Configuration
            API_URL: "https://api.myvideoresu.me/api",
            
            // Error Tracking (GlitchTip/Sentry)
            ERROR_REPORTING: {
              ENABLED: true,
              DSN: "https://43cf169b17fc4c1780849f0dd708ef39@app.glitchtip.com/12926",
              ENVIRONMENT: "production",
              SAMPLE_RATE: 0.1,
            },
            
            // Feature Flags
            FEATURES: {
              AI_CHAT: true,
              VIDEO_RESUMES: true,
              ANALYTICS: false,
              NOTIFICATIONS: true,
            },
            
            // Performance Monitoring
            PERFORMANCE: {
              MONITORING: false,
              SAMPLE_RATE: 0.1,
            },
            
            // Logging
            LOGGING: {
              LEVEL: "warn", // Only warnings and errors in production
              MAX_ENTRIES: 50,
            },
            
            // App Version (updated by build process)
            VERSION: "1.2.0",
            
            // Build timestamp (updated by build process)
            BUILD_TIME: "${BUILD_TIMESTAMP}",
          };
          EOF

      - name: Verify build artifacts
        run: |
          echo "Build artifacts:"
          ls -la dist/
          echo "SPA build size:"
          du -sh dist/
          echo "Production config:"
          head -20 dist/config.js

      - name: Deploy to SmarterASP.NET via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: ${{ secrets.FTP_PATH }}
          dangerous-clean-slate: true
          log-level: verbose
