name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "22.x"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install root dependencies
        # #524 — wrap in a retry loop so a single npm registry ECONNRESET
        # doesn't fail the entire build. --prefer-offline + --no-audit
        # also drops the audit-RTT cost on every install.
        # `npm install` (not `npm ci`) so a lockfile drift reconciles
        # against package.json instead of silently failing inside the
        # retry loop and leaving node_modules empty for typecheck.
        run: for i in 1 2 3; do npm install --prefer-offline --no-audit && break; sleep 5; done

      - name: Install shared dependencies
        # shared/ is a private workspace-style package that declares zod
        # as a dependency so both api/ and frontend/ can import its zod
        # schemas without the bundler failing at "Could not resolve zod".
        run: cd shared && (for i in 1 2 3; do npm install --omit=dev --prefer-offline --no-audit && break; sleep 5; done)

      - name: Install dependencies
        run: cd frontend && (for i in 1 2 3; do npm install --prefer-offline --no-audit && break; sleep 5; done)

      - name: Install api dependencies
        # api/ also needs its own deps to typecheck + run its 1944
        # node:test suite. Same retry loop so a single ECONNRESET
        # doesn't fail the build.
        run: cd api && (for i in 1 2 3; do npm install --prefer-offline --no-audit && break; sleep 5; done)

      - name: Run type checking (frontend)
        run: cd frontend && npm run typecheck

      - name: Run type checking (api)
        # Gates schema drift in the worker bundle (gap #1617). Was not
        # previously checked in CI, which is how `userProfiles.firstName
        # /lastName/bio` (#1591) and other drift landed on main unnoticed.
        run: cd api && npm run typecheck

      - name: Run api tests
        # 1944 node:test cases via scripts/run-tests.mjs (gap #1617).
        # Previous hand-glob in package.json missed `__tests__/` dirs in
        # domains/, middleware/, repositories/, handlers/,
        # services/{articles,interview,scorecards}/. The new discoverer
        # walks the tree so adding a `__tests__/` dir is a no-op.
        run: cd api && npm test

      - name: Run frontend tests (advisory)
        # 1166 vitest cases. 74 currently fail under network-mocking
        # gaps + one real `nullToUndefined` regression (gap #1618).
        # Kept advisory until #1595 closes so we don't block every PR on
        # a known triage backlog — failures still surface on every run.
        run: cd frontend && npm test
        continue-on-error: true

      - name: Run ESLint (api, advisory)
        # 27 pre-existing errors (gap #1619) including a real
        # `sql\`= ANY(${array})\`` ban that the worker pg driver can't
        # bind. Kept advisory until #1596 closes — failures visible on
        # every run so they can't grow unnoticed.
        run: cd api && npm run lint
        continue-on-error: true

      - name: Set build date
        run: echo "BUILD_DATE=$(date -u +'%Y.%m.%d')" >> $GITHUB_ENV

      - name: Build SPA
        run: cd frontend && npm run build
        env:
          VITE_BUILD_DATE: ${{ env.BUILD_DATE }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build-artifacts
          path: frontend/dist/
          retention-days: 7

  deploy-production:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: build-artifacts
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name hired

  deploy-api:
    name: Deploy API to Cloudflare Workers
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        # Install shared/ first so shared's zod runtime dep is available,
        # then api/ for the deploy bundle. Wrangler's esbuild resolves
        # shared/resume.ts's `import { z } from "zod"` via shared/node_modules,
        # which only exists after `npm ci` here.
        #
        # The shared/ fallback uses parens to keep both `npm install`
        # invocations running in the same already-cd'd directory —
        # the previous `cd shared && X || cd shared && Y` form re-cd'd
        # into shared/shared/ on the failure path and silently left
        # api/node_modules unpopulated.
        run: |
          set -e
          cd shared && npm install --omit=dev
          cd ../api && npm install

      - name: Validate DATABASE_URL secret
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "ERROR: DATABASE_URL secret is not set. Schema push will fail."
            exit 1
          fi

      - name: Push DB schema
        run: cd api && npm run db:push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run SQL migrations (fallback)
        # Belt-and-suspenders npm install — the upstream Install step
        # normally populates api/node_modules, but `if: always()` means
        # this step also runs when install partially failed. Re-running
        # npm install is a ~5s no-op when the cache is warm and recovers
        # the @neondatabase/serverless import that this script needs.
        if: always()
        run: |
          set -e
          cd api && npm install
          node scripts/run-sql-migrations.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Seed first-party Studio templates
        if: success()
        run: cd api && node scripts/seed-first-party-templates.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to Cloudflare Workers
        run: cd api && npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
