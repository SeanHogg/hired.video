name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "22.x"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install shared dependencies
        # shared/ is a private workspace-style package that declares zod
        # as a dependency so both api/ and frontend/ can import its zod
        # schemas without the bundler failing at "Could not resolve zod".
        run: cd shared && npm ci --omit=dev

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run type checking
        run: cd frontend && npm run typecheck

      - name: Build SPA
        run: cd frontend && npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build-artifacts
          path: |
            frontend/dist/
            frontend/package.json
            frontend/package-lock.json
          retention-days: 7

  deploy-production:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Set build date
        run: echo "BUILD_DATE=$(date -u +'%Y.%m.%d')" >> $GITHUB_ENV

      - name: Build application
        run: cd frontend && npm run build
        env:
          VITE_BUILD_DATE: ${{ env.BUILD_DATE }}

      - name: Deploy to Cloudflare Pages
        run: cd frontend && npx wrangler pages deploy dist --project-name hired
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-api:
    name: Deploy API to Cloudflare Workers
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        # Install shared/ first so shared's zod runtime dep is available,
        # then api/ for the deploy bundle. Wrangler's esbuild resolves
        # shared/resume.ts's `import { z } from "zod"` via shared/node_modules,
        # which only exists after `npm ci` here.
        #
        # The shared/ fallback uses parens to keep both `npm ci` and
        # `npm install` running in the same already-cd'd directory —
        # the previous `cd shared && X || cd shared && Y` form re-cd'd
        # into shared/shared/ on the failure path and silently left
        # api/node_modules unpopulated.
        run: |
          set -e
          cd shared && (npm ci --omit=dev || npm install --omit=dev)
          cd ../api && npm ci

      - name: Validate DATABASE_URL secret
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "ERROR: DATABASE_URL secret is not set. Schema push will fail."
            exit 1
          fi

      - name: Push DB schema
        run: cd api && npm run db:push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run SQL migrations (fallback)
        # Belt-and-suspenders npm ci — the upstream Install step normally
        # populates api/node_modules, but `if: always()` means this step
        # also runs when install partially failed. Re-running npm ci is a
        # ~5s no-op when the cache is warm and recovers the @neondatabase
        # /serverless import that this script needs.
        if: always()
        run: |
          set -e
          cd api && npm ci
          node scripts/run-sql-migrations.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Seed first-party Studio templates
        if: success()
        run: cd api && node scripts/seed-first-party-templates.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to Cloudflare Workers
        run: cd api && npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
