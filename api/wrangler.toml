name = "hired-api"
account_id = "15a91c1cf46bbc3377e7aad68190e1f1"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

# Routes (API + CDN for R2 assets)
routes = [
  "api.hired.video/*",
  "cdn.hired.video/*",
]

# Cron triggers — the scheduled() handler in worker.ts dispatches every
# registered cron tick into runScheduled(), which in turn fans out to the
# follow-up drip processor, the job queue, the registered-worker dispatcher,
# the monthly usage close, and the email-integration sweep. Each downstream
# gates itself by date/time so a single /5 tick is enough.
[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[[r2_buckets]]
binding = "VIDEO_BUCKET"
bucket_name = "hired-videos-temp"

# Edge cache shared by BillingService.getSubscription and the generic
# utils/edge-cache.ts `getOrSetCached` helper. Without this binding the
# in-memory Map is the only cache layer, and it dies with each isolate —
# meaning the 60s plan cache effectively never hit cross-request in prod.
#
# Create the namespace once with:
#   wrangler kv:namespace create KV_CACHE
#   wrangler kv:namespace create KV_CACHE --preview
# then paste the returned ids into `id` / `preview_id` below.
[[kv_namespaces]]
binding = "KV_CACHE"
id = "8be133d4c3554532bc42fa4587fbf260"
preview_id = "e1b7ddb50cb14765bfb3a8375544ca55"

[ai]
binding = "AI"

# Real-time chat backbone (gap #1230). One Durable Object per
# conversationId holds open WebSocket pairs for every connected client
# and broadcasts message / typing / presence events. Hibernation keeps
# the DO cheap when idle. Created lazily on first connect via
# `env.CHAT_ROOM.idFromName(conversationId)`.
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

# 3D world multiplayer (gap #1636). One DO per studio_projects.id —
# holds WebRTC signaling sockets + authoritative challenge claims.
# Per-frame gameplay (positions, animations) flows peer-to-peer over
# data channels and never touches this DO; the room only sees join /
# leave, SDP/ICE forwarding, and score claims. Hibernation keeps the
# DO ~free between play sessions. See api/src/durable/GameSignalingRoom.ts.
[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameSignalingRoom"

[[migrations]]
tag = "v1"
# SQLite-backed Durable Object — required on the Workers free plan (the
# classic `new_classes` storage backend is paid-only as of 2024-08).
# SQLite-backed DOs are the recommended default going forward and gain
# the same hibernation / WebSocket APIs we use in ChatRoom.
new_sqlite_classes = ["ChatRoom"]

[[migrations]]
tag = "v2"
# GameSignalingRoom — added in the same `new_sqlite_classes` family
# (SQLite-backed, hibernation-enabled) as ChatRoom. Separate migration
# tag so the original `v1` migration stays content-stable.
new_sqlite_classes = ["GameSignalingRoom"]

[vars]
# Partner domains are sourced from shared/security/partnerDomains.ts.
# This var is only for env-specific extras (preview deploys, staging
# URLs). Leave empty in normal operation.
FRONTEND_URL = ""
VITE_API_URL = "https://api.hired.video"
BASE_URL = "https://api.hired.video"
CDN_BASE_URL = "https://cdn.hired.video"
YOUTUBE_REDIRECT_URI = "https://api.hired.video/api/videos/youtube/callback"
EMAIL_FROM = "info@hired.video"
PAYMENT_PROVIDER = "helcim"
# Secrets (do NOT set values here — use `wrangler secret put <NAME> [--env production]`)
# wrangler secret put DATABASE_URL
# wrangler secret put JWT_SECRET
# -- Stripe (default payment provider) --
# wrangler secret put STRIPE_PUBLISHABLE_KEY
# wrangler secret put STRIPE_SECRET_KEY
# wrangler secret put STRIPE_WEBHOOK_SIGNING_KEY
# -- Helcim (active payment provider — PAYMENT_PROVIDER=helcim set above) --
# wrangler secret put HELCIM_API_TOKEN       ← REQUIRED — Helcim dashboard → All Tools → Integrations → API Access
# HELCIM_COLLECTION_FLOW = "modal"           ← modal | inline. Set as a plain [vars] entry, not a secret. Defaults to modal.
# wrangler secret put HELCIM_JS_TOKEN        ← REQUIRED when HELCIM_COLLECTION_FLOW=inline — Helcim.js Configuration token
# wrangler secret put HELCIM_JS_SECRET       ← reserved — Helcim.js amount hashing secret (not yet consumed)
# wrangler secret put HELCIM_WEBHOOK_TOKEN   ← optional — webhook signing secret
# wrangler secret put OPENROUTER_API_KEY
# wrangler secret put OPENROUTER_MODELS
# wrangler secret put GOOGLE_GEMINI_KEY
# wrangler secret put YOUTUBE_CLIENT_ID
# wrangler secret put YOUTUBE_CLIENT_SECRET
# wrangler secret put EMAIL_CLIENTID
# wrangler secret put EMAIL_SECRET
# -- OAuth social login --
# wrangler secret put GOOGLE_CLIENT_ID        # Google Cloud Console → Credentials
# wrangler secret put GOOGLE_CLIENT_SECRET    # Callback: https://api.hired.video/api/auth/oauth/google/callback
# wrangler secret put LINKEDIN_CLIENT_ID      # LinkedIn Developer Portal
# wrangler secret put LINKEDIN_CLIENT_SECRET  # Callback: https://api.hired.video/api/auth/oauth/linkedin/callback
# wrangler secret put GITHUB_CLIENT_ID        # GitHub → Settings → Developer settings → OAuth Apps
# wrangler secret put GITHUB_CLIENT_SECRET    # Callback: https://api.hired.video/api/auth/oauth/github/callback
# wrangler secret put MICROSOFT_CLIENT_ID     # Azure Portal → App registrations
# wrangler secret put MICROSOFT_CLIENT_SECRET # Callback: https://api.hired.video/api/auth/oauth/microsoft/callback
# wrangler secret put API_URL                 # https://api.hired.video (used to build OAuth callback URLs)
# -- Social publishing connection layer (PRD §5.0) --
# Layer-1 developer-app creds. Self-lane callback:    https://api.hired.video/api/social/oauth/callback
#                              Managed-lane callback:  https://api.hired.video/api/admin/social/oauth/callback
# YouTube reuses YOUTUBE_CLIENT_ID/SECRET; Instagram + Facebook reuse META_APP_ID/SECRET;
# LinkedIn reuses LINKEDIN_CLIENT_ID/SECRET (enable BOTH w_member_social and the
# Community Management API product so Lane A can post to the Company Page).
# wrangler secret put TIKTOK_CONTENT_CLIENT_KEY     # TikTok for Developers → Content Posting API app (NOT the ads app)
# wrangler secret put TIKTOK_CONTENT_CLIENT_SECRET  # open.tiktokapis.com — distinct from TIKTOK_APP_ID (ads)
# wrangler secret put X_CLIENT_ID                   # X developer portal (OAuth 2.0, paid tier) — PKCE
# wrangler secret put X_CLIENT_SECRET
# wrangler secret put SOCIAL_KMS_KEY                # token-column envelope key (falls back to PAID_MEDIA_KMS_KEY)
# wrangler secret put TURNSTILE_SECRET_KEY    # Cloudflare dashboard → Turnstile → site → Secret key.
                                              # Paired with the frontend's VITE_TURNSTILE_SITE_KEY (managed via
                                              # frontend/scripts/inject-build-env.mjs). Gates every unauthenticated
                                              # entry endpoint (register / login / forgot-password / magic-link)
                                              # via the shared captchaSoftCheck — miss is a soft signal per #1122.

[env.production]
name = "hired-api"
# The DB connection string is stored as a Wrangler secret, not in source control.
# Set it via:
#   wrangler secret put NEON_DATABASE_URL --env production
#   wrangler secret put NEON_DB_URL --env production
#
# NOTE: In some Cloudflare accounts, DATABASE_URL may conflict with an existing
# binding name; in that case use NEON_DB_URL (the name checked by the app).

[env.production.vars]
# Partner domains are sourced from shared/security/partnerDomains.ts.
# This var is only for env-specific extras (preview deploys, staging
# URLs). Leave empty in normal operation.
FRONTEND_URL = ""
VITE_API_URL = "https://api.hired.video"
BASE_URL = "https://api.hired.video"
CDN_BASE_URL = "https://cdn.hired.video"
YOUTUBE_REDIRECT_URI = "https://api.hired.video/api/videos/youtube/callback"
EMAIL_FROM = "info@hired.video"
PAYMENT_PROVIDER = "helcim"

[[env.production.r2_buckets]]
binding = "VIDEO_BUCKET"
bucket_name = "hired-videos-temp"

[[env.production.kv_namespaces]]
binding = "KV_CACHE"
id = "8be133d4c3554532bc42fa4587fbf260"

[env.production.ai]
binding = "AI"

[[env.production.durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[env.production.migrations]]
tag = "v1"
# SQLite-backed DO — see comment on the top-level [[migrations]] block.
new_sqlite_classes = ["ChatRoom"]

