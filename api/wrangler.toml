name = "myvideoresume-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "VIDEO_BUCKET"
bucket_name = "myvideoresume-videos-temp"

[vars]
FRONTEND_URL = "https://myvideoresu.me"

[env.production]
name = "myvideoresume-api"
vars = { FRONTEND_URL = "https://myvideoresu.me" }

[[env.production.r2_buckets]]
binding = "VIDEO_BUCKET"
bucket_name = "myvideoresume-videos-temp"
