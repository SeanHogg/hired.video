name = "myvideoresume-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
# DATABASE_URL is set via `wrangler secret put DATABASE_URL`
DATABASE_URL = ""

[[r2_buckets]]
binding = "VIDEO_BUCKET"
bucket_name = "myvideoresume-videos-temp"

[env.production]
name = "myvideoresume-api"

[env.production.vars]
# Production vars/secrets are set via wrangler secrets
DATABASE_URL = ""

[[env.production.r2_buckets]]
binding = "VIDEO_BUCKET"
bucket_name = "myvideoresume-videos-temp"
