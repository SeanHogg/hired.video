name = "hired-api"
account_id = "15a91c1cf46bbc3377e7aad68190e1f1"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Routes (both new and legacy domains)
routes = [
  "api.hired.video/*",
]

[[r2_buckets]]
binding = "VIDEO_BUCKET"
bucket_name = "hired-videos-temp"

[vars]
FRONTEND_URL = "https://hired.video"
# Local development DB connection (used by `neon()` in serverless DB client)
# Replace this with your local Neon/DB connection string when running `wrangler dev`.
# If you want to keep it secret, remove it from this file and set the env var directly.
DATABASE_URL = "postgresql://neondb_owner:npg_lsjDXv6B5gdG@ep-quiet-block-aj62u9e9-pooler.c-3.us-east-2.aws.neon.tech/neondb?channel_binding=require&sslmode=require"

[env.production]
name = "hired-api"
vars = { FRONTEND_URL = "https://hired.video" }

[[env.production.r2_buckets]]
binding = "VIDEO_BUCKET"
bucket_name = "hired-videos-temp"

# To expose the worker via your custom domains, set your Cloudflare zone_id below and
# add routes for both the new and legacy domains.
#
# Replace <YOUR_ZONE_ID> with the zone ID for the domain(s) you want to use.
# e.g. `wrangler zones list` to find it.

