  <!-- Google Consent Mode v2 — declare denied defaults BEFORE GTM loads so
       any tag GTM ships obeys the user's consent state. The cookie banner +
       useCookiePreferences hook later call gtag('consent','update',...) once
       the user picks. Honors Sec-GPC by leaving everything denied until the
       user explicitly opts in. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    window.gtag = window.gtag || gtag;
    gtag("consent", "default", {
      ad_storage: "denied",
      ad_user_data: "denied",
      ad_personalization: "denied",
      analytics_storage: "denied",
      personalization_storage: "denied",
      functionality_storage: "granted",
      security_storage: "granted",
      wait_for_update: 500
    });
  </script>
  <!-- End Google Consent Mode v2 -->

  <!-- Theme no-FOUC: apply the persisted (or system) color scheme to <html>
       BEFORE the app bundle loads, so a dark-mode user never sees a flash of
       the light theme. Mirrors next-themes' storageKey ("theme") + class
       strategy; the React <ThemeProvider> takes over once mounted. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        var dark = t === "dark" ||
          ((!t || t === "system") &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>
